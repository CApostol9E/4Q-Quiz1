<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>BMI Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Sofia&family=Trirong&display=swap" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">BMI Calculator</h1>
    <form onsubmit="calculateBMI(); return false;" onreset="clearBMIResult()">
        <div class="mb-3">
            <label for="weight" class="form-label">Weight (kg):</label>
            <input type="number" class="form-control" id="weight" required>
        </div>
        <div class="mb-3">
            <label for="height" class="form-label">Height (cm):</label>
            <input type="number" class="form-control" id="height" required>
        </div>
        <button type="submit" class="btn btn-primary">Calculate BMI</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
    </form>

    <div class="mt-4">
        <h4 id="bmiResult"></h4>
    </div>
</div>

<script>
function calculateBMI() {
    const weight = parseFloat(document.getElementById("weight").value);
    const heightCm = parseFloat(document.getElementById("height").value);
    const heightM = heightCm / 100;
    const bmi = weight / (heightM * heightM);
    const result = document.getElementById("bmiResult");

    let category = "";
    let color = "";

    if (bmi < 18.5) {
        category = "Underweight 😕";
        color = "blue";
    } else if (bmi >= 18.5 && bmi < 24.9) {
        category = "Normal weight 😊";
        color = "green";
    } else if (bmi >= 25 && bmi < 29.9) {
        category = "Overweight 😐";
        color = "orange";
    } else {
        category = "Obese 😟";
        color = "red";
    }

    result.innerHTML = `Your BMI is <strong>${bmi.toFixed(1)}</strong> (${category})`;
    result.style.color = color;
}

function clearBMIResult() {
    document.getElementById("bmiResult").innerHTML = "";
}
</script>
</body>
</html>
